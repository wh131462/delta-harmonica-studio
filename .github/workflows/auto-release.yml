name: Auto Release

# 打进 master / main 的提交如果遵守版本标记约定（feat: v1.2.3 / chore(release): v1.2.3），
# 自动打 tag 并触发 Release 流水线，省掉手工建 tag 这一步。
#
# 注意：用 GITHUB_TOKEN 推的 tag 不会触发别的 workflow（GitHub 防递归），
# 所以这里显式推 tag 之后再 workflow_dispatch 一把 release.yml（该事件是官方例外）。
# 想临时关掉自动发版：仓库 Settings → Variables 增加 AUTO_RELEASE=false。
on:
  push:
    branches: [master, main]

permissions:
  contents: write # 推 tag
  actions: write # dispatch release.yml

# 与 Release 用不同的 group，避免和发版本身互相排队
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect version commit
    if: vars.AUTO_RELEASE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 列表判断版本是否已发布，也需要历史来解析「上一个版本」
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect version from pushed commits
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # 新分支或强推时 before 全是 0，退化成扫描最近提交
          case "$BEFORE" in
            0000000000000000000000000000000000000000|'') scan="$AFTER" ;;
            *) scan="$BEFORE..$AFTER" ;;
          esac
          echo "扫描区间：$scan"
          node scripts/release-notes.mjs --scan "$scan" --out release-notes.md

      - name: Gate on version tag
        id: gate
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          SOURCE: ${{ steps.detect.outputs.source }}
        run: |
          if [ "$SOURCE" != "commit" ]; then
            echo "::notice::本次推送没有版本标记提交（feat: vX.Y.Z / chore(release): vX.Y.Z），跳过自动发版。"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::tag v$VERSION 已存在，跳过自动发版。"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::准备发布 v$VERSION"

      - name: Create tag
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          git tag "v$VERSION" "${{ github.event.after }}"
          git push origin "refs/tags/v$VERSION"

      - name: Dispatch Release workflow
        if: steps.gate.outputs.release == 'true'
        env:
          # GITHUB_TOKEN 可以触发 workflow_dispatch；若想用其他身份发版，配 RELEASE_DISPATCH_TOKEN
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f version="$VERSION" \
            -f publish=true

      - name: Upload notes (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-release-notes
          path: release-notes.md
          if-no-files-found: ignore
          retention-days: 3
